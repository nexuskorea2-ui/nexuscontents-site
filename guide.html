<style>
:root{
  --ground:#FAF8F7; --surface:#FFF; --surface-alt:#F1EDEB;
  --ink:#221C1D; --ink-soft:#4E4445; --muted:#7E7270;
  --line:#E6DFDC; --line-2:#CEC4C0;
  --accent:#A8303E; --accent-2:#E9D9DA;
  --deep:#17313A; --deep-ink:#EEF3F4; --deep-muted:#9CB6BE; --deep-line:#2E4E58;
  --f-d:"Gowun Batang","Nanum Myeongjo","Apple SD Gothic Neo",serif;
  --f-b:"IBM Plex Sans KR","Apple SD Gothic Neo",sans-serif;
  --f-dj:"Shippori Mincho","Hiragino Mincho ProN",serif;
  --f-bj:"Noto Sans JP","Hiragino Sans",sans-serif;
  --pad:clamp(1.25rem,5vw,4.5rem); --max:74rem;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#151213; --surface:#1C1718; --surface-alt:#231D1E;
  --ink:#F3EEEC; --ink-soft:#D5CAC7; --muted:#A3948F;
  --line:#312A2B; --line-2:#463B3C; --accent:#E28390; --accent-2:#3A272B;
  --deep:#0F2229; --deep-ink:#E6EEF0; --deep-muted:#8AA6AF; --deep-line:#26414A;
}}
:root[data-theme="dark"]{
  --ground:#151213; --surface:#1C1718; --surface-alt:#231D1E;
  --ink:#F3EEEC; --ink-soft:#D5CAC7; --muted:#A3948F;
  --line:#312A2B; --line-2:#463B3C; --accent:#E28390; --accent-2:#3A272B;
  --deep:#0F2229; --deep-ink:#E6EEF0; --deep-muted:#8AA6AF; --deep-line:#26414A;
}

*{box-sizing:border-box}
body{margin:0; background:var(--ground); color:var(--ink);
  font-family:var(--f-b); font-weight:300; font-size:1rem; line-height:1.8;
  -webkit-font-smoothing:antialiased; overflow-x:hidden}
h1,h2,h3{font-family:var(--f-d); font-weight:700; margin:0; line-height:1.28;
  word-break:keep-all; overflow-wrap:break-word; text-wrap:balance}
p,li,dd,dt{word-break:keep-all; overflow-wrap:break-word}

/* language-specific typography */
html[lang="ja"] body{font-family:var(--f-bj); line-height:1.9}
html[lang="ja"] h1,html[lang="ja"] h2,html[lang="ja"] h3{font-family:var(--f-dj); font-weight:700}
html[lang="ja"] h1,html[lang="ja"] h2,html[lang="ja"] h3,
html[lang="ja"] p,html[lang="ja"] li,html[lang="ja"] dd,html[lang="ja"] dt{word-break:normal}
html[lang="en"] body{word-break:normal}
html[lang="en"] h1,html[lang="en"] h2,html[lang="en"] h3,
html[lang="en"] p,html[lang="en"] li,html[lang="en"] dd,html[lang="en"] dt{word-break:normal}

.wrap{max-width:var(--max); margin-inline:auto; padding-inline:var(--pad)}
a{color:inherit}
a:focus-visible,button:focus-visible{outline:2px solid var(--accent); outline-offset:4px}
.lbl{font-size:.68rem; font-weight:500; letter-spacing:.26em; text-transform:uppercase; color:var(--muted); margin:0}
.lbl--a{color:var(--accent)}

/* masthead */
.mast{border-bottom:1px solid var(--line); background:var(--ground);
  position:sticky; top:0; z-index:20; backdrop-filter:saturate(1.2) blur(6px)}
.mast__in{display:flex; align-items:center; justify-content:space-between; gap:1.5rem;
  flex-wrap:wrap; padding-block:1.05rem}
.mark{display:flex; align-items:baseline; gap:.7rem; text-decoration:none}
.mark b{font-family:var(--f-d); font-size:1.3rem; font-weight:700; letter-spacing:.04em}
html[lang="ja"] .mark b{font-family:var(--f-dj)}
.mark i{font-style:normal; font-size:.66rem; letter-spacing:.42em; color:var(--muted); font-weight:500}
.mast__r{display:flex; align-items:center; gap:1.75rem; flex-wrap:wrap}
.mast nav{display:flex; gap:1.5rem; font-size:.82rem}
.mast nav a{color:var(--ink-soft); text-decoration:none; padding-block:.2rem;
  border-bottom:1px solid transparent; transition:border-color .25s,color .25s}
.mast nav a:hover{color:var(--accent); border-bottom-color:var(--accent)}
.langs{display:flex; align-items:center; gap:.1rem; border:1px solid var(--line-2); border-radius:2px}
.langs button{font:inherit; font-size:.66rem; font-weight:500; letter-spacing:.14em;
  background:none; border:0; color:var(--muted); padding:.4rem .6rem; cursor:pointer;
  transition:background .2s,color .2s}
.langs button:hover{color:var(--ink)}
.langs button[aria-current="true"]{background:var(--ink); color:var(--ground)}

/* hero */
.hero{padding-top:clamp(3rem,8vw,6.5rem); padding-bottom:clamp(2.5rem,6vw,4.5rem)}
.hero__in{display:grid; grid-template-columns:1fr; gap:clamp(2rem,5vw,3.5rem); align-items:end}
@media(min-width:56rem){.hero__in{grid-template-columns:2.75rem minmax(0,1.18fr) minmax(0,1fr); align-items:center}}
.rail{display:none}
@media(min-width:56rem){.rail{display:block; writing-mode:vertical-rl; transform:rotate(180deg);
  font-size:.64rem; letter-spacing:.36em; text-transform:uppercase; color:var(--muted);
  border-right:1px solid var(--line); padding-right:1.1rem;
  align-self:center; justify-self:start; white-space:nowrap}}
.hero h1{font-size:clamp(2.2rem,4.9vw,3.3rem); letter-spacing:-.015em; margin-block:1.1rem 1.5rem}
.hero__lead{max-width:36ch; color:var(--ink-soft); font-size:1.02rem; margin:0; white-space:pre-line}
[hidden]{display:none!important}
.hero__art{aspect-ratio:5/4; background-color:var(--surface-alt);
  background-image:radial-gradient(70% 80% at 65% 40%,var(--accent-2) 0%,transparent 65%),

  background-size:cover; background-position:62% 55%}
@media(min-width:56rem){.hero__art{margin-right:calc(-1 * (50vw - min(50vw, var(--max) / 2) + var(--pad))); aspect-ratio:auto; min-height:32rem}}

section{padding-block:clamp(3.25rem,7vw,5.5rem)}
.head{display:grid; gap:.55rem; margin-bottom:clamp(2rem,4vw,3rem);
  border-top:1px solid var(--ink); padding-top:1rem}
.head h2{font-size:clamp(1.6rem,3.6vw,2.35rem); letter-spacing:-.01em}
.head p{margin:.5rem 0 0; color:var(--muted); font-size:.95rem; max-width:46ch; white-space:pre-line}

/* diptych */
.dip{display:grid; grid-template-columns:1fr; margin-inline:calc(50% - 50vw); width:100vw}
@media(min-width:52rem){.dip{grid-template-columns:1fr 1fr}}
.pan{padding:clamp(2rem,5vw,3.5rem) var(--pad); display:flex; flex-direction:column; gap:1rem}
@media(min-width:52rem){
  .pan--l{padding-left:max(var(--pad),calc(50vw - var(--max)/2 + var(--pad)))}
  .pan--r{padding-right:max(var(--pad),calc(50vw - var(--max)/2 + var(--pad)))}}
.pan--l{background:var(--surface); border-top:1px solid var(--line); border-bottom:1px solid var(--line)}
.pan--r{background:var(--deep); color:var(--deep-ink)}
.pan h3{font-size:1.5rem; margin-top:.15rem}
.pan p{margin:0; font-size:.95rem; color:var(--ink-soft)}
.pan--r p{color:var(--deep-muted)}
.pan ul{list-style:none; margin:.4rem 0 0; padding:0; display:grid; gap:.6rem; font-size:.92rem; color:var(--ink-soft)}
.pan--r ul{color:var(--deep-muted)}
.pan li{display:grid; grid-template-columns:1rem 1fr; gap:.55rem}
.pan li::before{content:"—"; color:var(--accent); line-height:1.8}
.pan--r li::before{color:#EBAAB3}
.pan__go{margin-top:auto; padding-top:1.5rem; font-size:.85rem; letter-spacing:.06em;
  font-weight:500; text-decoration:none; display:inline-block}
.pan--l .pan__go{color:var(--accent)}
.pan--r .pan__go{color:#F0BFC5}
.pan__go:hover{text-decoration:underline; text-underline-offset:.35em}

/* process */
.flow{display:grid; grid-template-columns:1fr}
@media(min-width:60rem){.flow{grid-template-columns:repeat(4,1fr)}}
.node{padding:1.5rem 0; border-top:1px solid var(--line-2)}
@media(min-width:60rem){.node{padding:1.75rem 1.75rem 0 0}
  .node+.node{padding-left:1.75rem; border-left:1px solid var(--line)}}
.node__n{font-family:var(--f-d); font-size:2.1rem; line-height:1; color:var(--accent);
  font-variant-numeric:tabular-nums; display:block; margin-bottom:.9rem}

.node h3{font-size:1.02rem; margin-bottom:.45rem}
.node p{margin:0; font-size:.9rem; color:var(--ink-soft); white-space:pre-line}

/* scope */
.does{display:grid; grid-template-columns:1fr}

.do{padding:1.4rem 0; border-top:1px solid var(--line)}
.do h3{font-size:1.02rem; margin-bottom:.4rem}
.do p{margin:0; font-size:.91rem; color:var(--ink-soft)}
.note{margin:2rem 0 0; font-size:.86rem; color:var(--muted); line-height:1.7; max-width:56ch}

/* band */
.band{background:var(--deep); color:var(--deep-ink); margin-inline:calc(50% - 50vw); width:100vw}
.band .head{border-top-color:var(--deep-line)}
.band .head p,.band .lbl{color:var(--deep-muted)}
.tg{display:grid; grid-template-columns:1fr; gap:2rem}

.tg h3{font-family:var(--f-b); font-size:.72rem; font-weight:600; letter-spacing:.2em;
  color:var(--deep-muted); text-transform:uppercase;
  padding-bottom:.9rem; margin-bottom:1.2rem; border-bottom:1px solid var(--deep-line)}
html[lang="ja"] .tg h3{font-family:var(--f-bj)}
.tg ul{list-style:none; margin:0; padding:0; display:grid; gap:.9rem;

.pr{margin-top:2.4rem; padding:1.25rem 1.5rem; border-left:2px solid #EBAAB3;
  background:rgba(255,255,255,.04); font-size:.88rem; color:var(--deep-ink); font-weight:300}

/* record + contact */
.rec dl{margin:0; display:grid; grid-template-columns:1fr}
@media(min-width:34rem){.rec dl{grid-template-columns:8rem 1fr}}
.rec dt{font-size:.68rem; letter-spacing:.2em; text-transform:uppercase; color:var(--muted);

.rec dd{margin:0; padding-block:1rem; font-size:1rem; border-top:1px solid var(--line)}
@media(max-width:33.99rem){.rec dt{padding-bottom:.1rem} .rec dd{border-top:0; padding-top:.1rem}}
.cts{display:grid; grid-template-columns:1fr; margin-top:2.75rem; border-top:1px solid var(--line)}
@media(min-width:44rem){.cts{grid-template-columns:repeat(3,1fr)}}
.cts a{padding:1.6rem 0; text-decoration:none; display:grid; gap:.45rem;
  border-bottom:1px solid var(--line); transition:color .25s}
@media(min-width:44rem){.cts a{padding-inline:1.75rem}

.cts span{font-size:.66rem; letter-spacing:.22em; text-transform:uppercase; color:var(--muted)}
.cts strong{font-weight:400; font-size:1rem; word-break:break-all}
.cts a:hover strong{color:var(--accent)}

footer{border-top:1px solid var(--ink); margin-top:clamp(3rem,7vw,5rem); padding-block:2.25rem;
  display:flex; justify-content:space-between; gap:1rem; flex-wrap:wrap;

@media(hover:hover){.pan:hover,.node:hover,.cts a:hover{transform:translateY(-5px);box-shadow:0 16px 40px color-mix(in srgb,var(--ink) 7%,transparent)}.node:hover{border-color:var(--accent)}}
@keyframes orbit{to{transform:rotate(360deg)}}
@media(max-width:55.99rem){.hero__art{min-height:0;aspect-ratio:6/5;max-width:42rem;width:100%;justify-self:center}.hero h1{max-width:18ch}.hero__lead{max-width:52ch}.rail{display:none}}

@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*:before,*:after{animation:none!important;transition:none!important}}


/* Guide film */
.guide{margin-top:3rem;display:grid;grid-template-columns:minmax(0,1fr);gap:1.5rem;padding:clamp(1.2rem,3vw,2.5rem);background:var(--surface-alt);border:1px solid var(--line);border-radius:4px}
.guide__intro{min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:1rem;justify-content:center}.guide h3{font-size:clamp(1.6rem,3vw,2.1rem);font-weight:400}.guide__link{font-size:.8rem;color:var(--accent);text-underline-offset:.3em;overflow-wrap:anywhere}
.guide__screen{position:relative;aspect-ratio:16/9;min-width:0;background:var(--deep);border:1px solid var(--deep-line);border-radius:4px;overflow:hidden}
.guide__play{width:100%;height:100%;border:0;background:radial-gradient(ellipse at top right,var(--deep-line),transparent 70%),var(--deep);color:var(--deep-ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem;cursor:pointer;font:inherit;font-size:.9rem;padding:1rem}
.guide__icon{display:grid;place-items:center;width:4rem;height:4rem;padding-left:.2rem;border:1px solid var(--deep-muted);border-radius:50%;font-size:1rem;transition:transform .25s,background .25s}.guide__play:hover .guide__icon{transform:scale(1.08);background:var(--deep-line)}
#guide-player,.guide iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
@media(min-width:52rem){.guide{grid-template-columns:minmax(0,.7fr) minmax(0,1.6fr)}}

.guide-page{padding-block:3rem}.guide-page .guide{grid-template-columns:minmax(0,1fr);margin-top:1.5rem}.guide-page .guide__screen{width:100%;max-width:60rem;justify-self:center}.guide-page h1{font-size:clamp(2rem,4vw,3rem);font-weight:400}.guide-page .guide__intro{gap:.75rem}
.guide-help{font-size:.85rem;color:var(--ink-soft);line-height:1.8}.guide-page #guide-link{padding:.75rem 1.25rem;background:var(--accent);color:var(--ground);border-radius:30px;text-decoration:none}

@media(max-width:43.99rem){.guide-page{padding-block:1.5rem}.guide-page .guide{padding:1rem;gap:1.2rem}.guide-page #guide-link{min-height:48px;display:flex;align-items:center}.guide-page>.guide__link{display:inline-flex;align-items:center;min-height:44px}.guide-help{font-size:.85rem}.langs button{min-height:40px;min-width:36px}.mast nav a{display:inline-flex;align-items:center;min-height:44px}}

/* Requested Korean brand lockup; keep JA/EN labels unchanged. */
html[lang="ko"] .mark{gap:.5rem;align-items:baseline;white-space:nowrap}html[lang="ko"] .mark b{font-family:var(--f-b);font-weight:600;letter-spacing:.13em}html[lang="ko"] .mark i{display:inline;font-size:.72rem;letter-spacing:.04em;font-weight:400;color:var(--muted)}
@media(max-width:43.99rem){html[lang="ko"] .mark b{font-size:1rem;letter-spacing:.08em}html[lang="ko"] .mark i{font-size:.61rem;letter-spacing:0}html[lang="ko"] .mark{gap:.3rem}}
@media(max-width:22.49rem){.motion-control span{display:none}.motion-control{min-width:36px;justify-content:center}.mast__in{column-gap:.35rem}}


/* A single native player, sized to the source video's portrait ratio. */
.guide-page .guide__screen{display:block;width:min(100%,32rem,calc(var(--guide-available-height,75vh) * .5625));max-width:100%;height:auto;min-height:0;aspect-ratio:auto;justify-self:center;overflow:visible;border:0;border-radius:0;background:var(--ground)}
.guide-page .guide__screen::before{display:none}
.guide-page #guide-player{position:static;width:100%;height:auto}
.guide-page video{display:block;width:100%;height:auto;aspect-ratio:9/16;object-fit:contain;background:var(--ground)}
@media(max-width:43.99rem){
 .guide-page{padding-inline:0}
 .guide-page>.guide__link{margin-inline:var(--pad)}
 .guide-page .guide{padding:0;border:0;border-radius:0;background:none;gap:1rem}
 .guide-page .guide__intro,.guide-page .guide-help{padding-inline:var(--pad)}
}

</style>
</head>
<body>

<header class="mast">
  <div class="wrap mast__in">
    <a class="mark" href="index.html"><b data-ja="ネクサス" data-en="NEXUS">NEXUS</b><i data-ja="NEXUS" data-en="NEXUS">넥수스</i></a>
    <div class="mast__r">
      <nav>
        <a href="index.html#clinic" data-ja="クリニック・ブランド" data-en="For Clinics">클리닉·브랜드</a>
        <a href="index.html#creator" data-ja="クリエイター" data-en="For Creators">크리에이터</a>
        <a href="index.html#company" data-ja="会社情報" data-en="Company">회사 정보</a>
      </nav>
      <div class="langs" role="group" aria-label="Language">
        <button type="button" data-lang="ko">KO</button>
        <button type="button" data-lang="ja">JA</button>
        <button type="button" data-lang="en">EN</button>
      </div>
    </div>
  </div>
</header>

<main class="wrap guide-page" id="top"><a class="guide__link" href="index.html#guide" data-ja="← ホームページへ戻る" data-en="← Back to home">← 홈페이지로 돌아가기</a>    <!-- Guide video: separate from the preserved original copy. -->
    <div class="guide" id="guide">
      <div class="guide__intro">
        <p class="lbl lbl--a">Guide Film</p>
        <h1 data-ja="動画ガイド" data-en="Video guide">영상 가이드</h1>
        <a class="guide__link" id="guide-link" target="_blank" rel="noopener noreferrer" href="https://drive.google.com/file/d/1NC2APF3DWfEo6LW1UdfrIOLG1PnEQNRu/view" data-ja="新しいウィンドウで動画を見る ↗" data-en="Watch in a new window ↗">새 창에서 영상 보기 ↗</a>
      </div>
      <div class="guide__screen">
        <div id="guide-player"></div>
      </div>
    </div>
<p class="guide-help" data-ja="プレーヤーの再生ボタンを押してください。読み込まれない場合は「新しいウィンドウで動画を見る」からご覧ください。" data-en="Press play in the player. If it does not load, choose ‘Watch in a new window’.">플레이어의 재생 버튼을 눌러주세요. 화면이 나타나지 않으면 ‘새 창에서 영상 보기’를 이용해 주세요.</p></main>
<footer class="wrap">
  <span data-ja="ネクサス NEXUS · 韓国 水原市" data-en="NEXUS · Suwon, Republic of Korea">넥수스 NEXUS · 경기도 수원시</span>
  <span>&copy; 2026</span>
</footer>

<script>
(function () {
  // Fit the inline player below the sticky masthead, including browser chrome changes.
  function fitGuideViewport() {
    var mast = document.querySelector('.mast');
    var viewportHeight = window.visualViewport ? window.visualViewport.height : window.innerHeight;
    var available = Math.max(120, viewportHeight - mast.getBoundingClientRect().height - 24);
    document.documentElement.style.setProperty('--guide-available-height', available + 'px');
  }
  window.addEventListener('resize', fitGuideViewport);
  if (window.visualViewport) window.visualViewport.addEventListener('resize', fitGuideViewport);
  if (window.ResizeObserver) new ResizeObserver(fitGuideViewport).observe(document.querySelector('.mast'));
  fitGuideViewport();

  var KO = new Map();
  document.querySelectorAll("[data-ja],[data-en]").forEach(function (el) { KO.set(el, el.textContent); });

  var HREF = new Map();
  document.querySelectorAll("[data-ja-href],[data-en-href]").forEach(function (el) {
    HREF.set(el, el.getAttribute("href"));
  });

  var HIDE = [].slice.call(document.querySelectorAll("[data-ko-hide],[data-ja-hide],[data-en-hide]"));


  // "Watch in a new window": the films we host. The Drive copies below are the
  // previous versions and are no longer linked.
  var guideLinks = { ko: "guide-ko.mp4", ja: "guide-ja.mp4", en: "guide-en.mp4" };
  var guideVideos = {
    ja: "1tevolRdJkwXoaSK5Q4IuRuCoJPBYcryU",
    ko: "1NC2APF3DWfEo6LW1UdfrIOLG1PnEQNRu",
    en: "1R0Ps_iBqWQq-2xE-ZrWOB7QJMP5HsieO"
  };
  var guideLang = "ko";
  var guide = document.getElementById("guide");
  var player = document.getElementById("guide-player");
  function syncGuide(lang) {
    guideLang = lang;
    var id = guideVideos[lang];
    guide.hidden = !id;
    if (!id) return;
    document.getElementById("guide-link").href = guideLinks[lang] || ("https://drive.google.com/file/d/" + id + "/view");
    var previous = player.querySelector("video");
    if (previous) { previous.pause(); previous.removeAttribute("src"); previous.load(); }
    var video = document.createElement("video");
    video.src = "guide-" + lang + ".mp4";
    video.poster = "guide-" + lang + ".jpg";
    video.controls = true;
    video.playsInline = true;
    video.setAttribute("playsinline", "");
    video.preload = "metadata";
    video.width = 720;
    video.height = 1280;
    video.setAttribute("aria-label", lang === "ko" ? "한국어 가이드 영상" : lang === "ja" ? "日本語ガイド動画" : "English guide video");
    player.replaceChildren(video);
    player.hidden = false;
  }

  function apply(lang) {
    document.documentElement.lang = lang;
    document.querySelectorAll('a[href^="index.html"]').forEach(function (a) {
      var url = new URL(a.href); url.searchParams.set("lang", lang); a.href = url.href;
    });
    syncGuide(lang);
    KO.forEach(function (koText, el) {
      var v = lang === "ko" ? koText : el.getAttribute("data-" + lang);
      el.textContent = v || koText;
    });
    HREF.forEach(function (koHref, el) {
      var h = lang === "ko" ? koHref : el.getAttribute("data-" + lang + "-href");
      el.setAttribute("href", h || koHref);
    });
    HIDE.forEach(function (el) {
      el.hidden = el.hasAttribute("data-" + lang + "-hide");
    });
    document.querySelectorAll(".langs button").forEach(function (b) {
      b.setAttribute("aria-current", String(b.dataset.lang === lang));
    });
    try { localStorage.setItem("nexus-lang", lang); } catch (e) {}
  }

  function detect() {
    var requested = new URLSearchParams(location.search).get("lang");
    if (["ko", "ja", "en"].indexOf(requested) !== -1) return requested;
    try {
      var saved = localStorage.getItem("nexus-lang");
      if (saved === "ko" || saved === "ja" || saved === "en") return saved;
    } catch (e) {}
    var langs = navigator.languages && navigator.languages.length
      ? navigator.languages : [navigator.language || "ko"];
    for (var i = 0; i < langs.length; i++) {
      var t = String(langs[i]).toLowerCase();
      if (t.indexOf("ko") === 0) return "ko";
      if (t.indexOf("ja") === 0) return "ja";
    }
    return "en";
  }

  document.querySelectorAll(".langs button").forEach(function (b) {
    b.addEventListener("click", function () { apply(b.dataset.lang); });
  });

  apply(detect());
})();
</script>

</body>
