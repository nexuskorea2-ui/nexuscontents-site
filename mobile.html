<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEXUS · 이미지 다양화 시안</title>
<style>*{box-sizing:border-box}body{margin:0;background:#e9e4e2;color:#221c1d;font:14px -apple-system,BlinkMacSystemFont,sans-serif}header{padding:14px 20px;background:#faf8f7;display:flex;align-items:center;flex-wrap:wrap;gap:12px;border-bottom:1px solid #cec4c0}b{margin-right:auto;letter-spacing:.1em}button,select,a{font:inherit}button,select{border:1px solid #cec4c0;background:#fff;border-radius:20px;padding:8px 13px;cursor:pointer}button[aria-pressed=true]{background:#a8303e;color:white;border-color:#a8303e}p{margin:0;color:#6c6060;font-size:12px}main{padding:20px;overflow:auto;height:calc(100vh - 120px)}iframe{display:block;width:100%;height:100%;min-height:600px;border:0;margin:auto;background:#faf8f7;box-shadow:0 12px 60px #221c1d15}footer{padding:8px 20px;font-size:12px}a{color:#a8303e}</style>
<header><b>NEXUS · 이미지 다양화 시안</b><button id="new" aria-pressed="true">중복 없는 새 시안</button><button id="old" aria-pressed="false">현재 홈페이지</button><select id="width" aria-label="화면 너비"><option value="100%">현재 화면</option value="380px">모바일 · 380px</option><option value="768px">태블릿 · 768px</option><option value="1002px">1002px</option><option value="1280px">1280px</option><option value="1920px">1920px</option></select><p>로컬 미리보기 · 실제 홈페이지에는 반영되지 않았습니다.</p></header>
<main><iframe allow="autoplay; fullscreen; picture-in-picture; encrypted-media" allowfullscreen src="index.html?v=diverse1" title="NEXUS 디자인 미리보기"></iframe></main><footer><a href="index.html" target="_blank">시안 크게 열기 ↗</a> · 언어는 홈페이지 상단의 KO / JA / EN 버튼으로 전환할 수 있습니다.</footer>
<script>const frame=document.querySelector('iframe');for(const [id,file] of [['new','index.html?v=diverse1'],['old','original.html']])document.getElementById(id).onclick=()=>{frame.src=file;for(const key of ['new','old'])document.getElementById(key).setAttribute('aria-pressed',String(key===id))};document.getElementById('width').onchange=e=>frame.style.width=e.target.value;</script><script>frame.style.width="380px";document.getElementById("width").value="380px";</script></html>
